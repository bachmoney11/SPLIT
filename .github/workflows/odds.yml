# Kurzy z Polymarketu a Kalshi -> site/odds.json, a tip před zápasem -> site/snapshots.json. Trvá ~1 min.
name: Kurzy
on:
  schedule:
    - cron: "37 */2 * * *"      # každé 2 hodiny (čas UTC; GitHub může běh zpozdit o 5–30 min)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write             # nikdy dva zápisy do repozitáře najednou
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install requests==2.34.2
      - name: Stáhnout kurzy
        run: |
          mkdir -p data
          python odds.py > /dev/null
          n=$(python -c "import json; print(len(json.load(open('data/odds.json'))['matches']))")
          echo "$n trhů"
          # prázdná odpověď (výpadek API) nesmaže poslední známé kurzy
          if [ "$n" -gt 0 ] || [ ! -f site/odds.json ]; then cp data/odds.json site/odds.json; fi
      - name: Tip před zápasem
        run: python snapshot.py tips
      - name: Uložit
        run: |
          git config user.name "split-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/odds.json site/snapshots.json
          git diff --cached --quiet && exit 0
          git commit -m "kurzy $(date -u +%F\ %H:%M)"
          git pull --rebase origin main && git push origin HEAD:main

  publish:
    needs: odds
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
